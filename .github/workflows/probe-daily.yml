name: probe-daily

on:
  schedule:
    # 09:00 UTC = 06:00 America/Sao_Paulo — após madrugada JP/FR terem publicado
    - cron: "0 9 * * *"
  workflow_dispatch: {}   # permite disparo manual pra testar

permissions:
  contents: write

concurrency:
  group: probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install deps
        run: uv sync --locked

      - name: Run probe (com discover 1x/semana, às segundas)
        run: |
          if [ "$(date -u +%u)" = "1" ]; then
            uv run scraper/probe.py --discover
          else
            uv run scraper/probe.py
          fi

      - name: Generate frequency report
        run: uv run scraper/report.py

      - name: Commit results
        run: |
          git config user.name  "probe-bot"
          git config user.email "probe-bot@users.noreply.github.com"
          git add db/probes.sqlite reports/frequency-report.md
          git diff --cached --quiet || git commit -m "probe: $(date -u +%Y-%m-%d)"
          git push
