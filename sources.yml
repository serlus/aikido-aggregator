  - id: febrai
    name: FEBRAI — Federação Brasileira de Aikido
    url: https://aikidofebrai.com.br/
    country: BR
    lang: [pt]
    lineage: aikikai
    engine: http
    cadence: monthly
    priority: 2

  - id: fepai
