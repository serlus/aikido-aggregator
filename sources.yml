  - id: insbrai_rs
    name: INSBRAI — Instituto Sul-Brasileiro de Aikido (Porto Alegre/RS)
    url: https://aikido.com.br/
    country: BR
    lang: [pt]
    lineage: aikikai
    engine: wp_json    # confirmado na triagem 2026-07-27 (posts dez/2025);
    cadence: biweekly  # região-alvo do agregador (Sul do Brasil)
    priority: 1

  - id: aikido_rj
    name: Aikido Rio de Janeiro (Ichitami Shikanai)
    url: https://www.aikidoriodejaneiro.com.br/
    country: BR
